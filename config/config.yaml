defaults:
  - override hydra/sweeper: optuna
  - override hydra/launcher: joblib
  - _self_

model:
  hidden_size: 32
  n_layers: 1
  lr: 1e-3
  bidirectional: False
  sweep_epochs: 500
  entry_length: 10

data:
  path: "eeg_data/train/HC_preprocessed_alpha"

hydra:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    
    storage: null
    study_name: lstm_optimization
    direction: minimize

    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42

    n_trials: 96       
    n_jobs: 4

    params:
      model.hidden_size: 16,32,64,128
      model.n_layers: 1,2,3,4
      model.lr: 1e-3, 1e-2
      data.path: eeg_data/train/HC_preprocessed_theta, eeg_data/train/HC_preprocessed_alpha, eeg_data/train/HC_preprocessed_beta

  launcher:
    n_jobs: 4

  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}


